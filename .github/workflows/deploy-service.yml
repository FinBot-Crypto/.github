# =============================================================
# FinBot-Crypto — Pipeline Compartilhado de Deploy
# =============================================================
# Único workflow para todos os serviços:
#   → Build ARM64 → Push Docker Hub → Deploy VPS
#
# Secrets necessários na organização:
#   DOCKERHUB_USERNAME  (ex: finbotcrypto)
#   DOCKERHUB_TOKEN     (PAT do Docker Hub)
#   VPS_SSH_HOST
#   VPS_SSH_USER
#   VPS_SSH_KEY
#
# Uso no repo do serviço (.github/workflows/deploy.yml):
#   jobs:
#     deploy:
#       uses: FinBot-Crypto/.github/.github/workflows/deploy-service.yml@main
#       with:
#         service_name: fb-execution
#       secrets: inherit
# =============================================================

name: Build, Push & Deploy to VPS

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nome do serviço (ex: fb-execution)"
      compose_service:
        required: false
        type: string
        default: ""
        description: "Nome no docker-compose (default: sem prefixo fb-)"
      vps_base_path:
        required: false
        type: string
        default: "/root/crypto-bot"

jobs:
  build-push-deploy:
    name: "${{ inputs.service_name }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            SERVICE="${{ inputs.service_name }}"
            BASE="${{ inputs.vps_base_path }}"
            COMPOSE_SVC="${{ inputs.compose_service }}"
            if [ -z "$COMPOSE_SVC" ]; then
              COMPOSE_SVC=$(echo "$SERVICE" | sed 's/^fb-//')
            fi

            echo "=== Deploy: ${SERVICE} (compose: ${COMPOSE_SVC}) ==="

            cd "${BASE}"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose pull "${COMPOSE_SVC}"
            docker compose up -d --no-deps "${COMPOSE_SVC}"
            sleep 2
            docker compose ps "${COMPOSE_SVC}"

            echo "=== ✅ Deploy de ${SERVICE} concluído ==="
