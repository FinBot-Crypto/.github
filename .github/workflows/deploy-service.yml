# =============================================================
# FinBot-Crypto — Pipeline Compartilhado de Deploy
# =============================================================
# Workflow reutilizável: faz pull da imagem no GHCR e sobe o container.
# O BUILD + PUSH é feito pelo deploy.yml de cada serviço.
#
# Uso no repo do serviço:
#   deploy:
#     uses: FinBot-Crypto/.github/.github/workflows/deploy-service.yml@main
#     with:
#       service_name: fb-execution
#     secrets: inherit
# =============================================================

name: Deploy Service to VPS

on:
  workflow_call:
    inputs:
      service_name:
        description: "Nome do serviço (ex: fb-market-selection)"
        required: true
        type: string
      compose_service:
        description: "Nome no docker-compose (default: sem prefixo fb-)"
        required: false
        type: string
        default: ""
      vps_base_path:
        description: "Caminho base na VPS"
        required: false
        type: string
        default: "/root/crypto-bot"

jobs:
  deploy:
    name: "Deploy ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.VPS_SSH_HOST }}" ]; then echo "::error::VPS_SSH_HOST missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_USER }}" ]; then echo "::error::VPS_SSH_USER missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::VPS_SSH_KEY missing"; exit 1; fi
          echo "Secrets OK"

      - name: Deploy to Oracle VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            SERVICE="${{ inputs.service_name }}"
            BASE="${{ inputs.vps_base_path }}"
            COMPOSE_SVC="${{ inputs.compose_service }}"
            if [ -z "$COMPOSE_SVC" ]; then
              COMPOSE_SVC=$(echo "$SERVICE" | sed 's/^fb-//')
            fi

            echo "=== Deploy: ${SERVICE} (compose: ${COMPOSE_SVC}) ==="

            cd "${BASE}"

            # GHCR login (GITHUB_TOKEN passed via secrets)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin 2>/dev/null || true

            docker compose pull "${COMPOSE_SVC}"
            docker compose up -d --no-deps "${COMPOSE_SVC}"
            sleep 2
            docker compose ps "${COMPOSE_SVC}"

            echo "=== ✅ Deploy de ${SERVICE} concluído ==="
