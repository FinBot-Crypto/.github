# =============================================================
# FinBot-Crypto — Pipeline Compartilhado de Deploy
# =============================================================
# Roda no self-hosted runner da VPS Oracle.
# Build nativo ARM64, sem registry, deploy direto.
#
# Uso no repo do serviço:
#   jobs:
#     deploy:
#       uses: FinBot-Crypto/.github/.github/workflows/deploy-service.yml@main
#       with:
#         service_name: fb-execution
#       secrets: inherit
# =============================================================

name: Build & Deploy on VPS

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nome do serviço (ex: fb-execution)"
      compose_service:
        required: false
        type: string
        default: ""
        description: "Nome no docker-compose (default: sem prefixo fb-)"
      vps_base_path:
        required: false
        type: string
        default: "/root/crypto-bot"

jobs:
  build-deploy:
    name: "${{ inputs.service_name }}"
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive compose name
        id: compose
        run: |
          COMPOSE_SVC="${{ inputs.compose_service }}"
          if [ -z "$COMPOSE_SVC" ]; then
            COMPOSE_SVC=$(echo "${{ inputs.service_name }}" | sed 's/^fb-//')
          fi
          echo "compose_svc=$COMPOSE_SVC" >> $GITHUB_OUTPUT

      - name: Build and Deploy
        working-directory: ${{ inputs.vps_base_path }}
        run: |
          set -e
          SERVICE="${{ inputs.service_name }}"
          COMPOSE_SVC="${{ steps.compose.outputs.compose_svc }}"
          SERVICE_DIR="${{ inputs.vps_base_path }}/services/${SERVICE}"

          echo "=== Deploy: ${SERVICE} (compose: ${COMPOSE_SVC}) ==="

          # Copiar código fonte para o diretório do serviço
          mkdir -p "${SERVICE_DIR}"
          rsync -a --delete "$GITHUB_WORKSPACE/" "${SERVICE_DIR}/"

          # Build e restart
          docker compose up -d --build --no-deps "${COMPOSE_SVC}"
          sleep 2
          docker compose ps "${COMPOSE_SVC}"

          echo "=== ✅ Deploy de ${SERVICE} concluído ==="
